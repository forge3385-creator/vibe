</head>
<body>
  <script>
    window.vibePlaySynth = function(freq, durationMs, type, gainLevel) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!window._vibeAudioCtx) {
          window._vibeAudioCtx = new AudioCtx();
        }
        const ctx = window._vibeAudioCtx;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        const now = ctx.currentTime;
        const dur = (durationMs || 100) / 1000;
        const level = (gainLevel !== undefined ? gainLevel : 0.5) * 0.15;
        gain.gain.setValueAtTime(level, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      } catch (e) {
        // Autoplay policy or unsupported
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
