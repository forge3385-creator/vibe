version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vibe-postgres
    environment:
      POSTGRES_USER: vibe_user
      POSTGRES_PASSWORD: vibe_password
      POSTGRES_DB: vibe_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vibe-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vibe-backend
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://vibe_user:vibe_password@postgres:5432/vibe_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: vibe_master_jwt_secret_key_2026_purple_900
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
